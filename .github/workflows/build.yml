name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload sideloadable webext artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-picka-sideload-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          retention-days: 7
